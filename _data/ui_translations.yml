CVE (Common Vulnerabilities and Exposures), güvenlik açıklarının ortak bir kimlik numarasıyla tanımlanmasını sağlar. Aşağıda araştırmalarım kapsamında yer alan kayıtları ve yayımlanma durumlarını bulabilirsin.: CVE (Common Vulnerabilities and Exposures) gives security vulnerabilities a shared identifier. Below are the records from my research and their publication status.
CVE hakkında ↗: About CVE ↗
Yayımlandı: Published
Henüz yayımlanmadı: Not yet published
Yayımlanmamış kayıt: Unpublished record
Ürün ve teknik ayrıntılar henüz paylaşılmadı.: Product and technical details have not been disclosed yet.
Microsoft PowerToys’ta zayıf kimlik doğrulama nedeniyle yetkili bir saldırganın yerel ortamda yetkisiz değişiklik yapmasına olanak tanıyan açık.: Weak authentication in Microsoft PowerToys allows an authorized attacker to perform tampering locally.
Wolvox9 ERP’nin KontrolPanel.exe bileşeninde tespit edilen dizin geçişi (Path Traversal) açığı.: A path traversal vulnerability identified in the KontrolPanel.exe component of Wolvox9 ERP.
PassGate ürününde LDAP sorgularının işlenmesiyle ilgili LDAP Injection açığı.: An LDAP injection vulnerability in the way PassGate handles LDAP queries.
Açık türü: Vulnerability type
Bileşen: Component
